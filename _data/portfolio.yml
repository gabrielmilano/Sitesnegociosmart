# =====================================================================
#  PORTFÓLIO da home (seção #projetos) — _includes/portfolio.html
#
#  Desde 25/11/2026 a seção é separada por NICHO (lista "nichos", na ordem em que aparecem).
#  Cada projeto diz o "nicho" (id) e o "status"; dentro do nicho, clientes vêm primeiro:
#    cliente  = cliente fechado, site no ar    (selo "Cliente · no ar")
#    sistema  = sistema/produto da Negócios Smart (selo "Sistema próprio")
#    demo     = demonstração com dados fictícios  (selo "Demonstração")
#  Card largo: automático quando o nicho tem número ímpar de projetos (o primeiro fica largo).
#  Cliente novo: acrescentar em "projetos" com o nicho certo (ou criar o nicho) e tirar os prints.
#  Os ids dos nichos também são usados pelo analisador (assets/js/analisador.js).
#
#  Prints (nomes fixos a partir do "slug"), tirados com o capturar.js:
#    /assets/cases/<slug>.webp (1600×1000) + <slug>-800.webp
#    /assets/cases/<slug>-mobile.webp (520×1125) + <slug>-mobile-260.webp
#    /assets/cases/rolagem/<slug>-desktop.webp (1600×3000) + -desktop-800.webp
#  Não inventar números nem resultados: só o que está no ar.
# =====================================================================

# Faixas que cruzam no topo da seção (o que já foi entregue e para quem)
faixa_entregas:
  - "Páginas por serviço"
  - "SEO local"
  - "Pedido pelo WhatsApp"
  - "Agendamento online"
  - "Dados estruturados"
  - "Search Console"
  - "Painel com login"
  - "Busca com mapa"
  - "Assinaturas"
  - "Domínio próprio"
faixa_segmentos:
  - "Som automotivo"
  - "Películas"
  - "Podologia"
  - "Lavanderia"
  - "Corretores de imóveis"
  - "Finanças pessoais"
  - "Clínicas e consultórios"

# Ordem dos selos dentro de cada nicho
status_ordem: ["cliente", "sistema", "demo"]
status_rotulo:
  cliente: "Cliente · no ar"
  sistema: "Sistema próprio"
  demo: "Demonstração"

nichos:
