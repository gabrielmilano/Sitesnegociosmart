# =====================================================================
#  PORTFÓLIO da home (seção #projetos) — _includes/portfolio.html
#
#  Cada projeto entra num grupo pelo "status":
#    cliente  = site de cliente, no ar        (grupo "Clientes no ar")
#    sistema  = sistema/produto da Negócios Smart (grupo "Sistemas próprios")
#    demo     = demonstração com dados fictícios  (grupo "Demonstração")
#  "destaque: true" = card largo, no topo do grupo (um por grupo).
#
#  Prints (nomes fixos a partir do "slug"), tirados com o capturar.js:
#    /assets/cases/<slug>.webp (1600×1000) + <slug>-800.webp
#    /assets/cases/<slug>-mobile.webp (520×1125) + <slug>-mobile-260.webp
#    /assets/cases/rolagem/<slug>-desktop.webp (1600×3000) + -desktop-800.webp
#  Não inventar números nem resultados: só o que está no ar.
# =====================================================================

# Faixas que cruzam no topo da seção (o que já foi entregue e para quem)
faixa_entregas:
  - "Páginas por serviço"
  - "SEO local"
  - "Pedido pelo WhatsApp"
  - "Agendamento online"
  - "Dados estruturados"
  - "Search Console"
  - "Painel com login"
  - "Busca com mapa"
  - "Assinaturas"
  - "Domínio próprio"
faixa_segmentos:
  - "Som automotivo"
  - "Películas"
  - "Podologia"
  - "Lavanderia"
  - "Corretores de imóveis"
  - "Finanças pessoais"
  - "Clínicas e consultórios"

grupos:
  - status: "cliente"
    titulo: "Clientes no ar"
    texto: "Sites que trabalham todos os dias para negócios de Criciúma."
  - status: "sistema"
    titulo: "Sistemas próprios"
    texto: "Plataformas que a Negócios Smart construiu e mantém."
  - status: "demo"
    titulo: "Demonstração"
    texto: "Para testar antes de ter o seu."

projetos:
  - slug: "salame"
    fundo: "#17140f"   # cor de fundo atrás dos aparelhos (da identidade do projeto)
    cor: "#f5c518"     # detalhe de destaque
    status: "cliente"
    destaque: true
    nome: "Salame Som e Películas"
    segmento: "Som automotivo e películas"
    url: "https://salamesomepeliculas.com.br"
    url_curta: "salamesomepeliculas.com.br"
    texto: "Loja de som automotivo, multimídia e películas na Av. Centenário, em Criciúma. Site com a identidade do letreiro da loja, um carro interativo onde o cliente monta o som e escolhe o tom da película, e uma página para cada serviço, do som ao insulfilm (com a regra do Contran vidro por vidro). Cada pedido chega pronto no WhatsApp."
    tags: ["Carro interativo", "Páginas por serviço", "Pedido pelo WhatsApp", "Domínio próprio"]
    alt_desk: "Página inicial do site da Salame Som e Películas, som automotivo e insulfilm na Av. Centenário, em Criciúma"
    alt_cel: "Site da Salame Som e Películas aberto no celular"

